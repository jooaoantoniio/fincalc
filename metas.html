<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas Financeiras — FinCalc</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="metas">
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Fin<span>Calc</span></a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="calculadora.html">Juros</a>
        <a href="parcelamento.html">Parcelamento</a>
        <a href="salario.html">Salário</a>
        <a href="orcamento.html">Orçamento</a>
        <a href="metas.html">Metas</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Metas Financeiras</h1>
      <p class="page-subtitle">Defina seus objetivos e acompanhe quanto falta para chegar lá.</p>

      <div class="grid-2">
        <form id="form-metas" class="card">
          <h2>Nova meta</h2>
          <div class="form-group">
            <label for="nome">Nome da meta</label>
            <input type="text" id="nome" placeholder="Ex.: Reserva de emergência" maxlength="60" required>
          </div>
          <div class="row">
            <div class="form-group">
              <label for="alvo">Valor da meta (R$)</label>
              <input type="number" id="alvo" min="0" step="0.01" required>
            </div>
            <div class="form-group">
              <label for="atual">Já guardado (R$)</label>
              <input type="number" id="atual" min="0" step="0.01" value="0">
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label for="aporte">Aporte mensal (R$)</label>
              <input type="number" id="aporte" min="0" step="0.01" value="0">
            </div>
            <div class="form-group">
              <label for="taxa">Rendimento ao mês (%)</label>
              <input type="number" id="taxa" min="0" step="0.01" value="0.8">
            </div>
          </div>
          <button type="submit" class="btn btn-block">Adicionar meta</button>
        </form>

        <div class="card">
          <h2>Minhas metas</h2>
          <div id="lista-metas"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© <span id="ano"></span> FinCalc · Resultados apenas para simulação.</div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
